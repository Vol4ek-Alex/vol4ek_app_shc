  <script>
    const SUPABASE_URL = 'https://wiowprtgsueqzdgtdjqr.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_BBc7NEU8ZgTaWuwsKYC-1A_43vfGWTs';

    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const rawDaysList = [
      { id: 1, full: 'Понедельник', short: 'Пн' },
      { id: 2, full: 'Вторник', short: 'Вт' },
      { id: 3, full: 'Среда', short: 'Ср' },
      { id: 4, full: 'Четверг', short: 'Чт' },
      { id: 5, full: 'Пятница', short: 'Пт' },
      { id: 6, full: 'Суббота', short: 'Сб' }
    ];

    let activeDay = (new Date().getDay() === 0 || new Date().getDay() === 7) ? 1 : new Date().getDay();
    let allSchedule = [];
    let presets = [];
    let currentPresetTab = 'subject';
    let isDesktop = window.innerWidth >= 1280;
    let isCustomTime = false;

    function getWeekDays() {
      const now = new Date();
      const currentDay = now.getDay();
      const mondayOffset = currentDay === 0 ? -6 : 1 - currentDay;
      
      const monday = new Date(now);
      monday.setDate(now.getDate() + mondayOffset);

      const months = ['янв', 'фев', 'мар', 'апр', 'май', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];

      return rawDaysList.map((day, index) => {
        const date = new Date(monday);
        date.setDate(monday.getDate() + index);
        const dayNum = date.getDate();
        const monthName = months[date.getMonth()];
        const isToday = date.toDateString() === now.toDateString();
        const isPastSession = dayNum > 26;

        return {
          ...day,
          dateNum: dayNum,
          monthName: monthName,
          formattedDate: `${dayNum} ${monthName}`,
          isToday: isToday,
          isPastSession: isPastSession
        };
      });
    }

    function initGreeting() {
      const now = new Date();
      const options = { weekday: 'long', day: 'numeric', month: 'long' };
      const dateStr = now.toLocaleDateString('ru-RU', options);
      document.getElementById('greeting-date').innerText = dateStr.charAt(0).toUpperCase() + dateStr.slice(1);
    }

    window.addEventListener('resize', () => {
      const currentIsDesktop = window.innerWidth >= 1280;
      if (currentIsDesktop !== isDesktop) {
        isDesktop = currentIsDesktop;
        renderDaysNav();
        renderSchedule();
      }
    });

    function toggleCustomTime() {
      isCustomTime = !isCustomTime;
      const presetContainer = document.getElementById('pair-preset-container');
      const customContainer = document.getElementById('custom-time-container');
      const btn = document.getElementById('time-toggle-btn');

      if (isCustomTime) {
        presetContainer.classList.add('hidden');
        customContainer.classList.remove('hidden');
        btn.innerText = 'Выбрать готовую пару';
      } else {
        presetContainer.classList.remove('hidden');
        customContainer.classList.add('hidden');
        btn.innerText = 'Указать время вручную';
      }
    }

    function getTypeStyle(type) {
      switch(type) {
        case 'Лекция': return 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20';
        case 'Практика': return 'bg-amber-500/10 text-amber-400 border-amber-500/20';
        case 'Пара': return 'bg-rose-500/10 text-rose-400 border-rose-500/20';
        case 'Экзамен': return 'bg-purple-500/20 text-purple-300 border-purple-500/40 font-bold';
        default: return 'bg-indigo-500/10 text-indigo-400 border-indigo-500/20';
      }
    }

    function renderDaysNav() {
      const nav = document.getElementById('days-nav');
      const days = getWeekDays();

      if (isDesktop) {
        nav.innerHTML = `<div class="text-xs font-semibold uppercase tracking-wider text-slate-400 py-1">Обзор всей недели (сессия до 26-го числа)</div>`;
        return;
      }

      nav.innerHTML = `
        <div class="grid grid-cols-6 gap-2 w-full">
          ${days.map(day => {
            const isActive = activeDay === day.id;
            return `
              <button onclick="selectDay(${day.id})" class="w-full py-2.5 px-1 rounded-2xl font-semibold transition-all flex flex-col items-center justify-center ${isActive ? 'bg-gradient-to-b from-indigo-600 to-indigo-700 text-white shadow-lg shadow-indigo-600/30 border border-indigo-400/30' : 'glass-card text-slate-400 hover:text-white'} ${day.isPastSession ? 'opacity-40' : ''}">
                <span class="text-xs sm:text-sm flex items-center gap-1 font-bold">
                  ${day.short}
                  ${day.isToday ? '<span class="w-1.5 h-1.5 rounded-full bg-emerald-400 inline-block shadow-sm shadow-emerald-400"></span>' : ''}
                </span>
                <span class="text-[10px] sm:text-[11px] font-medium mt-0.5 ${isActive ? 'text-indigo-200' : 'text-slate-500'}">${day.formattedDate}</span>
              </button>
            `;
          }).join('')}
        </div>
      `;
    }

    async function loadData() {
      const { data: scheduleData } = await _supabase.from('schedule').select('*').order('time_start');
      const { data: presetsData } = await _supabase.from('presets').select('*').order('name');
      
      allSchedule = scheduleData || [];
      presets = presetsData || [];

      populateSelectOptions();
      renderSchedule();
      updateStatusWidget();
    }

    function populateSelectOptions() {
      const subjects = presets.filter(p => p.type === 'subject');
      const rooms = presets.filter(p => p.type === 'room');
      const teachers = presets.filter(p => p.type === 'teacher');

      document.getElementById('subject').innerHTML = subjects.map(s => `<option value="${s.name}">${s.name}</option>`).join('') || '<option value="">(Список пуст)</option>';
      document.getElementById('room').innerHTML = '<option value="">Не указано</option>' + rooms.map(r => `<option value="${r.name}">${r.name}</option>`).join('');
      document.getElementById('teacher').innerHTML = '<option value="">Не указано</option>' + teachers.map(t => `<option value="${t.name}">${t.name}</option>`).join('');
    }

    function timeToMinutes(timeStr) {
      if(!timeStr) return 0;
      const [h, m] = timeStr.split(':').map(Number);
      return h * 60 + m;
    }

    function updateStatusWidget() {
      const widget = document.getElementById('status-widget');
      const now = new Date();
      const currentDayOfWeek = now.getDay();
      
      if (now.getDate() > 26) {
        widget.innerHTML = `
          <div class="glass p-4 rounded-2xl border-l-4 border-slate-500 flex items-center gap-3">
            <span class="text-2xl">🎓</span>
            <div><div class="font-bold text-white text-sm">Сессия завершилась 26-го числа</div><div class="text-xs text-slate-400">График занятий выполнен.</div></div>
          </div>`;
        return;
      }

      if(currentDayOfWeek === 0) {
        widget.innerHTML = `
          <div class="glass p-4 rounded-2xl border-l-4 border-indigo-500 flex items-center gap-3">
            <span class="text-2xl">🌴</span>
            <div><div class="font-bold text-white text-sm">Воскресенье — выходной</div><div class="text-xs text-slate-400">Отдыхайте и набирайтесь сил!</div></div>
          </div>`;
        return;
      }

      const todayItems = allSchedule.filter(i => i.day_of_week === currentDayOfWeek && i.change_status !== 'cancelled')
                                     .sort((a,b) => timeToMinutes(a.time_start) - timeToMinutes(b.time_start));

      if(!todayItems.length) {
        widget.innerHTML = `
          <div class="glass p-4 rounded-2xl border-l-4 border-emerald-500 flex items-center gap-3">
            <span class="text-2xl">🎉</span>
            <div><div class="font-bold text-white text-sm">Сегодня нет пар</div><div class="text-xs text-slate-400">В расписании на сегодня ничего не запланировано.</div></div>
          </div>`;
        return;
      }

      const currentMinutes = now.getHours() * 60 + now.getMinutes();
      const currentPair = todayItems.find(i => currentMinutes >= timeToMinutes(i.time_start) && currentMinutes < timeToMinutes(i.time_end));
      const nextPair = todayItems.find(i => timeToMinutes(i.time_start) > currentMinutes);

      if(currentPair) {
        const leftMinutes = timeToMinutes(currentPair.time_end) - currentMinutes;
        widget.innerHTML = `
          <div class="glass p-4 rounded-2xl border-l-4 border-emerald-500 bg-emerald-500/5 flex justify-between items-center gap-3">
            <div>
              <div class="text-[10px] font-bold text-emerald-400 uppercase tracking-wider mb-0.5 flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span> Сейчас идет (${currentPair.type || 'Пара'})
              </div>
              <div class="font-bold text-white text-base">${currentPair.subject}</div>
              <div class="text-xs text-slate-400 mt-1">${currentPair.room ? '🏢 Корпус: ' + currentPair.room : ''} ${currentPair.teacher ? '• 👨‍🏫 ' + currentPair.teacher : ''}</div>
            </div>
            <div class="text-right shrink-0">
              <div class="text-xl md:text-2xl font-black text-emerald-400">${leftMinutes} мин</div>
              <div class="text-[10px] text-slate-400 uppercase tracking-wider font-semibold">до конца</div>
            </div>
          </div>`;
      } else if(nextPair) {
        const untilMinutes = timeToMinutes(nextPair.time_start) - currentMinutes;
        widget.innerHTML = `
          <div class="glass p-4 rounded-2xl border-l-4 border-amber-500 bg-amber-500/5 flex justify-between items-center gap-3">
            <div>
              <div class="text-[10px] font-bold text-amber-400 uppercase tracking-wider mb-0.5">Перерыв / Скоро пара</div>
              <div class="font-bold text-white text-base">${nextPair.subject}</div>
              <div class="text-xs text-slate-400 mt-1">${nextPair.room ? '🏢 Корпус: ' + nextPair.room : ''} ${nextPair.type ? '• ' + nextPair.type : ''}</div>
            </div>
            <div class="text-right shrink-0">
              <div class="text-xl md:text-2xl font-black text-amber-400">${untilMinutes} мин</div>
              <div class="text-[10px] text-slate-400 uppercase tracking-wider font-semibold">до начала</div>
            </div>
          </div>`;
      } else {
        widget.innerHTML = `
          <div class="glass p-4 rounded-2xl border-l-4 border-indigo-500 flex items-center gap-3">
            <span class="text-2xl">✅</span>
            <div><div class="font-bold text-white text-sm">Все пары на сегодня завершены</div><div class="text-xs text-slate-400">Отличная работа!</div></div>
          </div>`;
      }
    }

    function renderSchedule() {
      const container = document.getElementById('schedule-container');
      const days = getWeekDays();

      if (isDesktop) {
        container.innerHTML = days.map(day => {
          const dayItems = allSchedule.filter(i => i.day_of_week === day.id);
          return `
            <div class="space-y-3 ${day.isPastSession ? 'opacity-40' : ''}">
              <div class="glass p-3 rounded-2xl text-center border-b border-indigo-500/20">
                <div class="font-bold text-slate-200 text-sm">${day.full}</div>
                <div class="text-[11px] text-indigo-300 font-medium">${day.formattedDate} ${day.isPastSession ? '(После 26-го)' : ''}</div>
              </div>
              <div class="space-y-3">
                ${renderDayItemsHTML(dayItems)}
              </div>
            </div>
          `;
        }).join('');
      } else {
        const currentDay = days.find(d => d.id === activeDay);
        const currentItems = allSchedule.filter(i => i.day_of_week === activeDay);

        if (currentDay && currentDay.isPastSession) {
          container.innerHTML = `
            <div class="glass p-8 rounded-3xl text-center text-slate-400 space-y-2">
              <span class="text-3xl">🏁</span>
              <div class="font-bold text-white">Занятия завершены</div>
              <p class="text-xs">Занятия сессии только до 26-го числа.</p>
            </div>`;
        } else {
          container.innerHTML = renderDayItemsHTML(currentItems);
        }
      }
    }

    function renderDayItemsHTML(items) {
      if (!items.length) {
        return `
          <div class="glass p-8 rounded-3xl text-center text-slate-500 text-xs flex flex-col items-center justify-center gap-2">
            <span class="text-xl">🎉</span>
            <span>Пар нет</span>
          </div>
        `;
      }

      return items.map(item => {
        const isCancelled = item.change_status === 'cancelled';
        const isMoved = item.change_status === 'moved';

        return `
          <div class="glass-card p-4 rounded-2xl relative group transition-all duration-200 ${isCancelled ? 'opacity-50 line-through border-rose-500/30 bg-rose-950/10' : ''} ${isMoved ? 'border-amber-500/30 bg-amber-950/10' : ''}">
            <div class="flex justify-between items-start mb-2.5">
              <span class="text-[11px] font-bold px-2.5 py-1 rounded-xl bg-slate-900/90 text-indigo-300 border border-white/10 tracking-wide">
                ${item.time_start} - ${item.time_end}
              </span>
              <div class="flex gap-1">
                <button onclick="openChangeModal('${item.id}')" title="Замена / Заметка" class="w-7 h-7 rounded-lg bg-white/5 hover:bg-white/10 flex items-center justify-center text-xs text-amber-400 transition">⚠️</button>
                <button onclick="editModal('${item.id}')" title="Редактировать" class="w-7 h-7 rounded-lg bg-white/5 hover:bg-white/10 flex items-center justify-center text-xs text-slate-400 hover:text-indigo-400 transition">✏️</button>
                <button onclick="deleteItem('${item.id}')" title="Удалить" class="w-7 h-7 rounded-lg bg-white/5 hover:bg-white/10 flex items-center justify-center text-xs text-slate-400 hover:text-rose-400 transition">🗑️</button>
              </div>
            </div>

            <h4 class="font-bold text-white text-sm md:text-base leading-snug mb-2">${item.subject}</h4>

            ${item.change_note ? `
              <div class="mb-2.5 px-2.5 py-1.5 rounded-xl bg-amber-500/10 border border-amber-500/20 text-amber-300 text-xs font-semibold flex items-center gap-1.5 no-underline">
                <span>⚠️</span> <span>${item.change_note}</span>
              </div>
            ` : ''}

            <div class="flex flex-wrap items-center gap-2 text-xs">
              ${item.type ? `<span class="px-2 py-0.5 rounded-lg border font-medium text-[11px] ${getTypeStyle(item.type)}">${item.type}</span>` : ''}
              ${item.room ? `<span class="text-slate-400 font-medium">🏢 Корпус: ${item.room}</span>` : ''}
            </div>

            ${item.teacher ? `<div class="mt-2.5 pt-2 border-t border-white/5 text-xs text-slate-400 flex items-center gap-1"><span>👨‍🏫</span> <span>${item.teacher}</span></div>` : ''}
          </div>
        `;
      }).join('');
    }

    function selectDay(id) {
      activeDay = id;
      renderDaysNav();
      renderSchedule();
    }

    function openModal() {
      document.getElementById('item-id').value = '';
      document.getElementById('modal-title').innerText = 'Новая пара';
      document.getElementById('day_of_week').value = activeDay;
      
      isCustomTime = false;
      document.getElementById('pair-preset-container').classList.remove('hidden');
      document.getElementById('custom-time-container').classList.add('hidden');
      document.getElementById('time-toggle-btn').innerText = 'Указать время вручную';

      document.getElementById('modal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modal').classList.add('hidden');
    }

    function openChangeModal(id) {
      const item = allSchedule.find(i => i.id === id);
      if(!item) return;

      document.getElementById('change-item-id').value = item.id;
      document.getElementById('change-item-subject').value = item.subject;
      document.getElementById('change_status').value = item.change_status || 'none';
      document.getElementById('change_note').value = item.change_note || '';

      document.getElementById('change-modal').classList.remove('hidden');
    }

    function closeChangeModal() {
      document.getElementById('change-modal').classList.add('hidden');
    }

    async function savePairChange(e) {
      e.preventDefault();

      const id = document.getElementById('change-item-id').value;
      const status = document.getElementById('change_status').value;
      const note = document.getElementById('change_note').value;

      await _supabase.from('schedule').update({
        change_status: status,
        change_note: note
      }).eq('id', id);

      closeChangeModal();
      loadData();
    }

    function editModal(id) {
      const item = allSchedule.find(i => i.id === id);
      if (!item) return;

      document.getElementById('item-id').value = item.id;
      document.getElementById('modal-title').innerText = 'Редактировать пару';
      document.getElementById('day_of_week').value = item.day_of_week;
      
      const timeStr = `${item.time_start}-${item.time_end}`;
      const presetSelect = document.getElementById('pair_slot');

      if (Array.from(presetSelect.options).some(opt => opt.value === timeStr)) {
        presetSelect.value = timeStr;
        isCustomTime = false;
        document.getElementById('pair-preset-container').classList.remove('hidden');
        document.getElementById('custom-time-container').classList.add('hidden');
      } else {
        document.getElementById('time_start').value = item.time_start;
        document.getElementById('time_end').value = item.time_end;
        isCustomTime = true;
        document.getElementById('pair-preset-container').classList.add('hidden');
        document.getElementById('custom-time-container').classList.remove('hidden');
      }

      document.getElementById('subject').value = item.subject;
      document.getElementById('type').value = item.type || 'Лекция';
      document.getElementById('room').value = item.room || '';
      document.getElementById('teacher').value = item.teacher || '';

      document.getElementById('modal').classList.remove('hidden');
    }

    async function saveItem(e) {
      e.preventDefault();

      let start = '';
      let end = '';

      if (isCustomTime) {
        start = document.getElementById('time_start').value;
        end = document.getElementById('time_end').value;
      } else {
        const slotValue = document.getElementById('pair_slot').value;
        [start, end] = slotValue.split('-');
      }

      const id = document.getElementById('item-id').value;
      const payload = {
        day_of_week: parseInt(document.getElementById('day_of_week').value),
        pair_number: 1,
        time_start: start,
        time_end: end,
        subject: document.getElementById('subject').value,
        type: document.getElementById('type').value,
        room: document.getElementById('room').value,
        teacher: document.getElementById('teacher').value
      };

      if (id) {
        await _supabase.from('schedule').update(payload).eq('id', id);
      } else {
        await _supabase.from('schedule').insert([payload]);
      }

      closeModal();
      loadData();
    }

    async function deleteItem(id) {
      if (confirm('Удалить эту пару?')) {
        await _supabase.from('schedule').delete().eq('id', id);
        loadData();
      }
    }

    /* Справочники */
    function openPresetsModal() {
      renderPresetsList();
      document.getElementById('presets-modal').classList.remove('hidden');
    }

    function closePresetsModal() {
      document.getElementById('presets-modal').classList.add('hidden');
    }

    function switchPresetTab(tab) {
      currentPresetTab = tab;
      ['subject', 'room', 'teacher'].forEach(t => {
        const btn = document.getElementById(`tab-${t}`);
        if(t === tab) {
          btn.className = "pb-2.5 px-3 text-xs font-bold border-b-2 border-indigo-500 text-indigo-400 transition";
        } else {
          btn.className = "pb-2.5 px-3 text-xs font-bold text-slate-400 hover:text-slate-200 transition";
        }
      });
      renderPresetsList();
    }

    function renderPresetsList() {
      const list = document.getElementById('presets-list');
      const filtered = presets.filter(p => p.type === currentPresetTab);

      if(!filtered.length) {
        list.innerHTML = `<div class="text-xs text-slate-500 text-center py-4">Список пуст</div>`;
        return;
      }

      list.innerHTML = filtered.map(p => `
        <div class="flex justify-between items-center bg-[#121522] border border-white/5 px-3.5 py-2.5 rounded-xl text-xs font-medium">
          <span class="text-slate-200">${p.name}</span>
          <button onclick="deletePreset('${p.id}')" class="text-[11px] text-rose-400 hover:text-rose-300 font-semibold transition">Удалить</button>
        </div>
      `).join('');
    }

    async function addPreset() {
      const input = document.getElementById('new-preset-name');
      const name = input.value.trim();
      if(!name) return;

      await _supabase.from('presets').insert([{ type: currentPresetTab, name }]);
      input.value = '';
      await loadData();
      renderPresetsList();
    }

    async function deletePreset(id) {
      await _supabase.from('presets').delete().eq('id', id);
      await loadData();
      renderPresetsList();
    }

    /* ЛОГИКА ГЕНЕРАЦИИ И ПОДЕЛИТЬСЯ ИЗОБРАЖЕНИЕМ */
    async function shareScheduleImage() {
      const days = getWeekDays();
      const targetDay = isDesktop ? days[0] : days.find(d => d.id === activeDay);
      const dayItems = allSchedule.filter(i => i.day_of_week === (isDesktop ? targetDay.id : activeDay) && i.change_status !== 'cancelled')
                                 .sort((a,b) => timeToMinutes(a.time_start) - timeToMinutes(b.time_start));

      document.getElementById('share-card-subtitle').innerText = `${targetDay.full}, ${targetDay.formattedDate}`;
      const listContainer = document.getElementById('share-card-list');

      if (!dayItems.length) {
        listContainer.innerHTML = `
          <div style="padding: 24px; text-align: center; color: #94a3b8; background-color: #121522; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.08); font-size: 14px;">
            🎉 В этот день нет занятий!
          </div>`;
      } else {
        listContainer.innerHTML = dayItems.map(item => `
          <div style="padding: 14px 16px; background-color: #121522; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.08);">
            
            <div style="display: flex; justify-between; align-items: center; margin-bottom: 8px;">
              <span style="font-size: 11px; font-weight: 700; color: #a5b4fc; background-color: rgba(99, 102, 241, 0.15); padding: 4px 10px; border-radius: 8px; border: 1px solid rgba(99, 102, 241, 0.2);">
                ${item.time_start} – ${item.time_end}
              </span>
              ${item.type ? `<span style="font-size: 11px; font-weight: 600; color: #94a3b8;">${item.type}</span>` : ''}
            </div>

            <div style="font-size: 15px; font-weight: 700; color: #ffffff; line-height: 1.3; margin-bottom: 6px;">
              ${item.subject}
            </div>

            ${item.change_note ? `
              <div style="font-size: 11px; font-weight: 600; color: #fbbf24; background-color: rgba(245, 158, 11, 0.1); padding: 6px 10px; border-radius: 8px; margin-bottom: 6px; border: 1px solid rgba(245, 158, 11, 0.2);">
                ⚠️ ${item.change_note}
              </div>
            ` : ''}

            <div style="display: flex; justify-between; align-items: center; font-size: 11px; color: #94a3b8; margin-top: 6px;">
              <div>${item.room ? `🏢 Корпус: ${item.room}` : ''}</div>
              <div>${item.teacher ? `👨‍🏫 ${item.teacher}` : ''}</div>
            </div>

          </div>
        `).join('');
      }

      const template = document.getElementById('share-card-template');

      try {
        const canvas = await html2canvas(template, {
          backgroundColor: '#0b0d14',
          scale: 3,
          useCORS: true,
          logging: false
        });

        canvas.toBlob(async (blob) => {
          const file = new File([blob], `schedule-${targetDay.short}.png`, { type: 'image/png' });

          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            try {
              await navigator.share({
                files: [file],
                title: 'Расписание занятий',
                text: `Расписание на ${targetDay.full} (${targetDay.formattedDate})`
              });
            } catch (err) {
              if (err.name !== 'AbortError') downloadImage(canvas, targetDay.short);
            }
          } else {
            downloadImage(canvas, targetDay.short);
          }
        }, 'image/png');
      } catch (e) {
        alert('Ошибка при формировании картинки');
      }
    }

    function downloadImage(canvas, dayShort) {
      const link = document.createElement('a');
      link.download = `schedule-${dayShort}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    // Инициализация
    initGreeting();
    renderDaysNav();
    loadData();
    setInterval(updateStatusWidget, 30000);
  </script>
</body>
</html>
