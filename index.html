<!DOCTYPE html>

  <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22Расписание%22,%22short_name%22:%22Расписание%22,%22start_url%22:%22/%22,%22display%22:%22standalone%22,%22background_color%22:%22#020617%22,%22theme_color%22:%22#020617%22}">

</head>
<body class="h-full flex flex-col pb-24 md:pb-10 pt-safe antialiased selection:bg-indigo-500 selection:text-white">

  <!-- Шапка -->
  <header class="sticky top-0 z-30 glass border-b border-slate-800/60 px-4 py-4 md:px-8">
    <div class="max-w-7xl mx-auto flex justify-between items-center">

        </div>
        <div>

      <!-- Кнопки в шапке -->

  <main class="flex-1 max-w-7xl w-full mx-auto px-4 md:px-8 pt-4">
    
    <!-- ПРИВЕТСТВИЕ С ПОЖЕЛАНИЕМ -->

    <!-- ВИДЖЕТ ТЕКУЩЕГО СТАТУСА -->

  <!-- Кнопки для мобилок внизу -->

  <!-- МОДАЛКА 1: Форма пары -->
  <div id="modal" class="hidden fixed inset-0 z-50 flex items-end md:items-center justify-center p-0 md:p-4 bg-slate-950/80 backdrop-blur-md transition-all">
    <div class="glass-modal w-full max-w-lg rounded-t-3xl md:rounded-3xl p-6 shadow-2xl border-t md:border border-slate-700/50 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-6">
        <h3 id="modal-title" class="text-xl font-bold text-white">Новое занятие</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-white text-xl p-2">✕</button>
      </div>

      <form onsubmit="saveItem(event)" class="space-y-4">
        <input type="hidden" id="item-id">

        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">День недели</label>
          <select id="day_of_week" class="w-full bg-slate-900/90 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-indigo-500">
            <option value="1">Понедельник</option>
            <option value="2">Вторник</option>
            <option value="3">Среда</option>
            <option value="4">Четверг</option>
            <option value="5">Пятница</option>
            <option value="6">Суббота</option>
          </select>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Начало</label>
            <input type="text" id="time_start" placeholder="08:30" required class="w-full bg-slate-900/90 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-indigo-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Окончание</label>
            <input type="text" id="time_end" placeholder="10:05" required class="w-full bg-slate-900/90 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-indigo-500">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Предмет</label>
          <select id="subject" required class="w-full bg-slate-900/90 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-indigo-500"></select>
        </div>

        <div class="grid grid-cols-2 gap-3">

              <option value="Практика">Практика</option>
              <option value="Лабораторная">Лабораторная</option>
              <option value="Консультация">Консультация</option>
              <option value="Экзамен">Экзамен</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Корпус</label>
            <select id="room" class="w-full bg-slate-900/90 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-indigo-500"></select>
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Преподаватель</label>
          <select id="teacher" class="w-full bg-slate-900/90 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-indigo-500"></select>

        <div class="flex gap-3 pt-4">
          <button type="button" onclick="closeModal()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold py-3 rounded-xl transition">

          <button type="submit" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl shadow-lg shadow-indigo-600/30 transition">
            Сохранить

        </div>
      </form>
    </div>
  </div>

  <!-- МОДАЛКА 2: Отмена или замена конкретной пары -->
  <div id="change-modal" class="hidden fixed inset-0 z-50 flex items-end md:items-center justify-center p-0 md:p-4 bg-slate-950/80 backdrop-blur-md transition-all">
    <div class="glass-modal w-full max-w-lg rounded-t-3xl md:rounded-3xl p-6 shadow-2xl border-t md:border border-amber-500/30 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-6">
        <h3 class="text-xl font-bold text-white flex items-center gap-2">⚠️ Замена / Заметка к паре</h3>
        <button onclick="closeChangeModal()" class="text-slate-400 hover:text-white text-xl p-2">✕</button>
      </div>

      <form onsubmit="savePairChange(event)" class="space-y-4">
        <input type="hidden" id="change-item-id">

        <div>
          <label class="block text-xs font-semibold text-amber-400 uppercase tracking-wider mb-2">Предмет</label>
          <input type="text" id="change-item-subject" readonly class="w-full bg-slate-900/50 border border-slate-800 rounded-xl px-4 py-3 text-slate-400 font-bold focus:outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold text-amber-400 uppercase tracking-wider mb-2">Статус / Изменение</label>
          <select id="change_status" class="w-full bg-slate-900/90 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-amber-500">
            <option value="none">Обычная пара (Без изменений)</option>
            <option value="cancelled">🚫 Пара отменена</option>
            <option value="moved">🔄 Перенос / Замена</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Примечание (например, другой корпус или время)</label>
          <input type="text" id="change_note" placeholder="Например: В ауд. 302, со 2 недели или Перенесено на 14:00" class="w-full bg-slate-900/90 border border-slate-800 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-amber-500">
        </div>

        <div class="flex gap-3 pt-4">
          <button type="button" onclick="closeChangeModal()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold py-3 rounded-xl transition">
            Отмена
          </button>
          <button type="submit" class="flex-1 bg-amber-600 hover:bg-amber-500 text-white font-semibold py-3 rounded-xl shadow-lg shadow-amber-600/30 transition">
            Сохранить
          </button>

      </form>
    </div>

  <!-- МОДАЛКА 3: Редактор Справочников -->

    <div class="glass-modal w-full max-w-lg rounded-t-3xl md:rounded-3xl p-6 shadow-2xl border-t md:border border-slate-700/50 max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-6">
        <h3 class="text-xl font-bold text-white">⚙️ Управление справочниками</h3>
        <button onclick="closePresetsModal()" class="text-slate-400 hover:text-white text-xl p-2">✕</button>
      </div>

      <div class="flex border-b border-slate-800 mb-4 gap-2">
        <button onclick="switchPresetTab('subject')" id="tab-subject" class="pb-2 px-3 text-sm font-semibold border-b-2 border-indigo-500 text-indigo-400">Предметы</button>
        <button onclick="switchPresetTab('room')" id="tab-room" class="pb-2 px-3 text-sm font-semibold text-slate-400">Корпусы</button>
        <button onclick="switchPresetTab('teacher')" id="tab-teacher" class="pb-2 px-3 text-sm font-semibold text-slate-400">Преподаватели</button>
      </div>

      <div class="flex gap-2 mb-4">
        <input type="text" id="new-preset-name" placeholder="Название..." class="flex-1 bg-slate-900/90 border border-slate-800 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-indigo-500 text-sm">
        <button onclick="addPreset()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold px-4 rounded-xl text-sm transition">Добавить</button>
      </div>

      <div id="presets-list" class="space-y-2 max-h-60 overflow-y-auto pr-1"></div>
    </div>
  </div>

  <!-- СКРЫТЫЙ ШАБЛОН ДЛЯ ГЕНЕРАЦИИ КАРТИНКИ -->
  <div class="fixed -left-[9999px] top-0">
    <div id="share-card-template" class="w-[480px] bg-slate-950 text-slate-100 p-6 rounded-3xl border border-slate-800 shadow-2xl space-y-4">
      <div class="flex items-center justify-between border-b border-slate-800/80 pb-4">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-indigo-500 to-purple-500 flex items-center justify-center font-bold text-lg text-white">
            🎓
          </div>
          <div>
            <h3 id="share-card-title" class="font-bold text-lg text-white">Расписание занятий</h3>
            <p id="share-card-subtitle" class="text-xs text-indigo-400 font-semibold"></p>
          </div>
        </div>
        <div class="text-right text-xs text-slate-500 font-medium">Академия</div>
      </div>

      <div id="share-card-list" class="space-y-3"></div>

      <div class="pt-2 border-t border-slate-800/60 text-center text-[10px] text-slate-500 font-medium">
        Сгенерировано в приложении моего любимого мужа :3
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://wiowprtgsueqzdgtdjqr.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_BBc7NEU8ZgTaWuwsKYC-1A_43vfGWTs';

    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const rawDaysList = [
      { id: 1, full: 'Понедельник', short: 'Пн' },
      { id: 2, full: 'Вторник', short: 'Вт' },
      { id: 3, full: 'Среда', short: 'Ср' },
      { id: 4, full: 'Четверг', short: 'Чт' },
      { id: 5, full: 'Пятница', short: 'Пт' },
      { id: 6, full: 'Суббота', short: 'Сб' }
    ];

    let activeDay = (new Date().getDay() === 0 || new Date().getDay() === 7) ? 1 : new Date().getDay();
    let allSchedule = [];
    let presets = [];
    let currentPresetTab = 'subject';
    let isDesktop = window.innerWidth >= 1280;

    function getWeekDays() {
      const now = new Date();
      const currentDay = now.getDay();
      const mondayOffset = currentDay === 0 ? -6 : 1 - currentDay;
      
      const monday = new Date(now);
      monday.setDate(now.getDate() + mondayOffset);

      const months = ['янв', 'фев', 'мар', 'апр', 'май', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];

      return rawDaysList.map((day, index) => {
        const date = new Date(monday);
        date.setDate(monday.getDate() + index);
        const dayNum = date.getDate();
        const monthName = months[date.getMonth()];
        const isToday = date.toDateString() === now.toDateString();
        const isPastSession = dayNum > 26;

        return {
          ...day,
          dateNum: dayNum,
          monthName: monthName,
          formattedDate: `${dayNum} ${monthName}`,
          isToday: isToday,
          isPastSession: isPastSession
        };
      });
    }

    function initGreeting() {
      const now = new Date();
      const options = { weekday: 'long', day: 'numeric', month: 'long' };
      const dateStr = now.toLocaleDateString('ru-RU', options);
      document.getElementById('greeting-date').innerText = dateStr.charAt(0).toUpperCase() + dateStr.slice(1);
    }

    window.addEventListener('resize', () => {
      const currentIsDesktop = window.innerWidth >= 1280;
      if (currentIsDesktop !== isDesktop) {
        isDesktop = currentIsDesktop;
        renderDaysNav();
        renderSchedule();
      }
    });

    function getTypeStyle(type) {
      switch(type) {
        case 'Лекция': return 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20';
        case 'Практика': return 'bg-amber-500/10 text-amber-400 border-amber-500/20';
        case 'Пара': return 'bg-rose-500/10 text-rose-400 border-rose-500/20';
        case 'Экзамен': return 'bg-purple-500/20 text-purple-300 border-purple-500/40 font-bold';
        default: return 'bg-indigo-500/10 text-indigo-400 border-indigo-500/20';
      }
    }

    function renderDaysNav() {
      const nav = document.getElementById('days-nav');
      const days = getWeekDays();

      if (isDesktop) {
        nav.innerHTML = `<div class="text-sm font-semibold text-slate-400 py-1">Обзор всей недели (сессия до 26-го числа)</div>`;
        return;
      }

      nav.innerHTML = `
        <div class="grid grid-cols-6 gap-1.5 sm:gap-2 w-full">
          ${days.map(day => {
            const isActive = activeDay === day.id;
            return `
              <button onclick="selectDay(${day.id})" class="w-full py-2 px-1 rounded-2xl font-semibold transition-all flex flex-col items-center justify-center ${isActive ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30' : 'glass text-slate-400 hover:text-white'} ${day.isPastSession ? 'opacity-40' : ''}">
                <span class="text-xs sm:text-sm flex items-center gap-1">
                  ${day.short}
                  ${day.isToday ? '<span class="w-1.5 h-1.5 rounded-full bg-emerald-400 inline-block"></span>' : ''}
                </span>
                <span class="text-[10px] sm:text-xs font-normal ${isActive ? 'text-indigo-200' : 'text-slate-500'}">${day.formattedDate}</span>
              </button>
            `;
          }).join('')}
        </div>
      `;
    }

    async function loadData() {
      const { data: scheduleData } = await _supabase.from('schedule').select('*').order('time_start');
      const { data: presetsData } = await _supabase.from('presets').select('*').order('name');
      
      allSchedule = scheduleData || [];
      presets = presetsData || [];

      populateSelectOptions();
      renderSchedule();
      updateStatusWidget();
    }

    function populateSelectOptions() {
      const subjects = presets.filter(p => p.type === 'subject');
      const rooms = presets.filter(p => p.type === 'room');
      const teachers = presets.filter(p => p.type === 'teacher');

      document.getElementById('subject').innerHTML = subjects.map(s => `<option value="${s.name}">${s.name}</option>`).join('') || '<option value="">(Список пуст)</option>';
      document.getElementById('room').innerHTML = '<option value="">Не указано</option>' + rooms.map(r => `<option value="${r.name}">${r.name}</option>`).join('');
      document.getElementById('teacher').innerHTML = '<option value="">Не указано</option>' + teachers.map(t => `<option value="${t.name}">${t.name}</option>`).join('');
    }

    function timeToMinutes(timeStr) {
      if(!timeStr) return 0;
      const [h, m] = timeStr.split(':').map(Number);
      return h * 60 + m;
    }

    function updateStatusWidget() {
      const widget = document.getElementById('status-widget');
      const now = new Date();
      const currentDayOfWeek = now.getDay();
      
      if (now.getDate() > 26) {
        widget.innerHTML = `
          <div class="glass p-4 rounded-2xl border-l-4 border-slate-500 flex items-center gap-3">
            <span class="text-2xl">🎓</span>
            <div><div class="font-bold text-white">Сессия завершилась 26-го числа</div><div class="text-xs text-slate-400">График занятий выполнен.</div></div>
          </div>`;
        return;
      }

      if(currentDayOfWeek === 0) {
        widget.innerHTML = `
          <div class="glass p-4 rounded-2xl border-l-4 border-indigo-500 flex items-center gap-3">
            <span class="text-2xl">🌴</span>
            <div><div class="font-bold text-white">Воскресенье — выходной</div><div class="text-xs text-slate-400">Отдыхайте и набирайтесь сил!</div></div>
          </div>`;
        return;
      }

      const todayItems = allSchedule.filter(i => i.day_of_week === currentDayOfWeek && i.change_status !== 'cancelled')
                                     .sort((a,b) => timeToMinutes(a.time_start) - timeToMinutes(b.time_start));

      if(!todayItems.length) {
        widget.innerHTML = `
          <div class="glass p-4 rounded-2xl border-l-4 border-emerald-500 flex items-center gap-3">
            <span class="text-2xl">🎉</span>
            <div><div class="font-bold text-white">Сегодня нет пар</div><div class="text-xs text-slate-400">В расписании на сегодня ничего не запланировано.</div></div>
          </div>`;
        return;
      }

      const currentMinutes = now.getHours() * 60 + now.getMinutes();
      const currentPair = todayItems.find(i => currentMinutes >= timeToMinutes(i.time_start) && currentMinutes < timeToMinutes(i.time_end));
      const nextPair = todayItems.find(i => timeToMinutes(i.time_start) > currentMinutes);

      if(currentPair) {
        const leftMinutes = timeToMinutes(currentPair.time_end) - currentMinutes;
        widget.innerHTML = `
          <div class="glass p-4 rounded-2xl border-l-4 border-emerald-500 bg-emerald-500/5 flex justify-between items-center gap-3">
            <div>
              <div class="text-xs font-semibold text-emerald-400 uppercase tracking-wider mb-0.5">Сейчас идет (${currentPair.type || 'Пара'})</div>
              <div class="font-bold text-white text-base">${currentPair.subject}</div>
              <div class="text-xs text-slate-400 mt-1">${currentPair.room ? '🏢 Корпус: ' + currentPair.room : ''} ${currentPair.teacher ? '• 👨‍🏫 ' + currentPair.teacher : ''}</div>
            </div>
            <div class="text-right shrink-0">
              <div class="text-xl md:text-2xl font-black text-emerald-400">${leftMinutes} мин</div>
              <div class="text-[10px] text-slate-400 uppercase tracking-wider">до конца</div>
            </div>
          </div>`;
      } else if(nextPair) {
        const untilMinutes = timeToMinutes(nextPair.time_start) - currentMinutes;
        widget.innerHTML = `
          <div class="glass p-4 rounded-2xl border-l-4 border-amber-500 bg-amber-500/5 flex justify-between items-center gap-3">
            <div>
              <div class="text-xs font-semibold text-amber-400 uppercase tracking-wider mb-0.5">Перерыв / Скоро пара</div>
              <div class="font-bold text-white text-base">${nextPair.subject}</div>
              <div class="text-xs text-slate-400 mt-1">${nextPair.room ? '🏢 Корпус: ' + nextPair.room : ''} ${nextPair.type ? '• ' + nextPair.type : ''}</div>
            </div>
            <div class="text-right shrink-0">
              <div class="text-xl md:text-2xl font-black text-amber-400">${untilMinutes} мин</div>
              <div class="text-[10px] text-slate-400 uppercase tracking-wider">до начала</div>
            </div>
          </div>`;
      } else {
        widget.innerHTML = `
          <div class="glass p-4 rounded-2xl border-l-4 border-indigo-500 flex items-center gap-3">
            <span class="text-2xl">✅</span>
            <div><div class="font-bold text-white">Все пары на сегодня завершены</div><div class="text-xs text-slate-400">Отличная работа!</div></div>
          </div>`;
      }
    }

    function renderSchedule() {
      const container = document.getElementById('schedule-container');
      const days = getWeekDays();

      if (isDesktop) {
        container.innerHTML = days.map(day => {
          const dayItems = allSchedule.filter(i => i.day_of_week === day.id);
          return `
            <div class="space-y-3 ${day.isPastSession ? 'opacity-40' : ''}">
              <div class="glass p-3 rounded-2xl text-center border-b border-indigo-500/30">
                <div class="font-bold text-slate-200">${day.full}</div>
                <div class="text-xs text-indigo-300 font-medium">${day.formattedDate} ${day.isPastSession ? '(После 26-го)' : ''}</div>
              </div>
              <div class="space-y-3">
                ${renderDayItemsHTML(dayItems)}
              </div>
            </div>
          `;
        }).join('');
      } else {
        const currentDay = days.find(d => d.id === activeDay);
        const currentItems = allSchedule.filter(i => i.day_of_week === activeDay);

        if (currentDay && currentDay.isPastSession) {
          container.innerHTML = `
            <div class="glass p-8 rounded-3xl text-center text-slate-400 space-y-2">
              <span class="text-3xl">🏁</span>
              <div class="font-bold text-white">Занятия завершены</div>
              <p class="text-xs">Занятия сессии только до 26-го числа.</p>
            </div>`;
        } else {
          container.innerHTML = renderDayItemsHTML(currentItems);
        }
      }
    }

    function renderDayItemsHTML(items) {
      if (!items.length) {
        return `
          <div class="glass p-8 rounded-3xl text-center text-slate-500 text-sm flex flex-col items-center justify-center gap-2">
            <span>🎉</span>
            <span>Пар нет</span>
          </div>
        `;
      }

      return items.map(item => {
        const isCancelled = item.change_status === 'cancelled';
        const isMoved = item.change_status === 'moved';

        return `
          <div class="glass p-4 rounded-2xl relative group hover:border-slate-700 transition-all ${isCancelled ? 'opacity-50 line-through border-rose-500/30 bg-rose-950/10' : ''} ${isMoved ? 'border-amber-500/40 bg-amber-950/10' : ''}">
            <div class="flex justify-between items-start mb-2">
              <span class="text-xs font-bold px-2.5 py-1 rounded-lg bg-slate-900/80 text-indigo-300 border border-slate-800">
                ${item.time_start} - ${item.time_end}
              </span>
              <div class="flex gap-1 opacity-90 group-hover:opacity-100">
                <button onclick="openChangeModal('${item.id}')" title="Замена / Заметка" class="text-xs text-amber-400 hover:text-amber-300 p-1">⚠️</button>
                <button onclick="editModal('${item.id}')" title="Редактировать" class="text-xs text-slate-400 hover:text-indigo-400 p-1">✏️</button>
                <button onclick="deleteItem('${item.id}')" title="Удалить" class="text-xs text-slate-400 hover:text-rose-400 p-1">🗑️</button>
              </div>
            </div>

            <h4 class="font-bold text-white text-base leading-snug mb-2">${item.subject}</h4>

            ${item.change_note ? `
              <div class="mb-2.5 px-2.5 py-1.5 rounded-lg bg-amber-500/10 border border-amber-500/30 text-amber-300 text-xs font-semibold flex items-center gap-1.5 no-underline">
                <span>⚠️</span> <span>${item.change_note}</span>
              </div>
            ` : ''}

            <div class="flex flex-wrap items-center gap-2 text-xs">
              ${item.type ? `<span class="px-2 py-0.5 rounded-md border font-medium ${getTypeStyle(item.type)}">${item.type}</span>` : ''}
              ${item.room ? `<span class="text-slate-400">🏢 Корпус: ${item.room}</span>` : ''}
            </div>

            ${item.teacher ? `<div class="mt-2 pt-2 border-t border-slate-800/60 text-xs text-slate-400">👨‍🏫 ${item.teacher}</div>` : ''}
          </div>
        `;
      }).join('');
    }

    function selectDay(id) {
      activeDay = id;
      renderDaysNav();
      renderSchedule();
    }

    function openModal() {
      document.getElementById('item-id').value = '';
      document.getElementById('modal-title').innerText = 'Новая пара';
      document.getElementById('day_of_week').value = activeDay;
      document.getElementById('modal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modal').classList.add('hidden');
    }

    /* Модалка изменения пары */
    function openChangeModal(id) {
      const item = allSchedule.find(i => i.id === id);
      if(!item) return;

      document.getElementById('change-item-id').value = item.id;
      document.getElementById('change-item-subject').value = item.subject;
      document.getElementById('change_status').value = item.change_status || 'none';
      document.getElementById('change_note').value = item.change_note || '';

      document.getElementById('change-modal').classList.remove('hidden');
    }

    function closeChangeModal() {
      document.getElementById('change-modal').classList.add('hidden');
    }

    async function savePairChange(e) {
      e.preventDefault();

      const id = document.getElementById('change-item-id').value;
      const status = document.getElementById('change_status').value;
      const note = document.getElementById('change_note').value;

      await _supabase.from('schedule').update({
        change_status: status,
        change_note: note
      }).eq('id', id);

      closeChangeModal();
      loadData();
    }

    function editModal(id) {
      const item = allSchedule.find(i => i.id === id);
      if (!item) return;

      document.getElementById('item-id').value = item.id;
      document.getElementById('modal-title').innerText = 'Редактировать пару';
      document.getElementById('day_of_week').value = item.day_of_week;
      document.getElementById('time_start').value = item.time_start;
      document.getElementById('time_end').value = item.time_end;
      document.getElementById('subject').value = item.subject;
      document.getElementById('type').value = item.type || 'Лекция';
      document.getElementById('room').value = item.room || '';
      document.getElementById('teacher').value = item.teacher || '';

      document.getElementById('modal').classList.remove('hidden');
    }

    async function saveItem(e) {
      e.preventDefault();

      const id = document.getElementById('item-id').value;
      const payload = {
        day_of_week: parseInt(document.getElementById('day_of_week').value),
        pair_number: 1,
        time_start: document.getElementById('time_start').value,
        time_end: document.getElementById('time_end').value,
        subject: document.getElementById('subject').value,
        type: document.getElementById('type').value,
        room: document.getElementById('room').value,
        teacher: document.getElementById('teacher').value
      };

      if (id) {
        await _supabase.from('schedule').update(payload).eq('id', id);
      } else {
        await _supabase.from('schedule').insert([payload]);
      }

      closeModal();
      loadData();
    }

    async function deleteItem(id) {
      if (confirm('Удалить эту пару?')) {
        await _supabase.from('schedule').delete().eq('id', id);
        loadData();
      }
    }

    /* Справочники */
    function openPresetsModal() {
      renderPresetsList();
      document.getElementById('presets-modal').classList.remove('hidden');
    }

    function closePresetsModal() {
      document.getElementById('presets-modal').classList.add('hidden');
    }

    function switchPresetTab(tab) {
      currentPresetTab = tab;
      ['subject', 'room', 'teacher'].forEach(t => {
        const btn = document.getElementById(`tab-${t}`);
        if(t === tab) {
          btn.className = "pb-2 px-3 text-sm font-semibold border-b-2 border-indigo-500 text-indigo-400";
        } else {
          btn.className = "pb-2 px-3 text-sm font-semibold text-slate-400";
        }
      });
      renderPresetsList();
    }

    function renderPresetsList() {
      const list = document.getElementById('presets-list');
      const filtered = presets.filter(p => p.type === currentPresetTab);

      if(!filtered.length) {
        list.innerHTML = `<div class="text-xs text-slate-500 text-center py-4">Список пуст</div>`;
        return;
      }

      list.innerHTML = filtered.map(p => `
        <div class="flex justify-between items-center bg-slate-900/60 border border-slate-800 px-3 py-2 rounded-xl text-sm">
          <span class="text-slate-200">${p.name}</span>
          <button onclick="deletePreset('${p.id}')" class="text-xs text-rose-400 hover:text-rose-300">Удалить</button>
        </div>
      `).join('');
    }

    async function addPreset() {
      const input = document.getElementById('new-preset-name');
      const name = input.value.trim();
      if(!name) return;

      await _supabase.from('presets').insert([{ type: currentPresetTab, name }]);
      input.value = '';
      await loadData();
      renderPresetsList();
    }

    async function deletePreset(id) {
      await _supabase.from('presets').delete().eq('id', id);
      await loadData();
      renderPresetsList();
    }

    /* ЛОГИКА ГЕНЕРАЦИИ И ПОДЕЛИТЬСЯ ИЗОБРАЖЕНИЕМ */
    async function shareScheduleImage() {
      const days = getWeekDays();
      const targetDay = isDesktop ? days[0] : days.find(d => d.id === activeDay);
      const dayItems = allSchedule.filter(i => i.day_of_week === (isDesktop ? targetDay.id : activeDay) && i.change_status !== 'cancelled')
                                 .sort((a,b) => timeToMinutes(a.time_start) - timeToMinutes(b.time_start));

      document.getElementById('share-card-subtitle').innerText = `${targetDay.full}, ${targetDay.formattedDate}`;
      const listContainer = document.getElementById('share-card-list');

      if (!dayItems.length) {
        listContainer.innerHTML = `
          <div class="p-6 text-center text-slate-400 bg-slate-900/50 rounded-2xl border border-slate-800">
            🎉 В этот день нет занятий!
          </div>`;
      } else {
        listContainer.innerHTML = dayItems.map(item => `
          <div class="p-3.5 bg-slate-900/90 rounded-2xl border border-slate-800 space-y-1.5">
            <div class="flex justify-between items-center">
              <span class="text-xs font-bold text-indigo-300 bg-indigo-950/60 px-2 py-0.5 rounded-md border border-indigo-800/40">
                ${item.time_start} - ${item.time_end}
              </span>
              ${item.type ? `<span class="text-[11px] font-semibold text-slate-400">${item.type}</span>` : ''}
            </div>
            <div class="font-bold text-sm text-white">${item.subject}</div>
            ${item.change_note ? `<div class="text-xs text-amber-400 font-semibold">⚠️ ${item.change_note}</div>` : ''}
            <div class="flex justify-between items-center text-xs text-slate-400 pt-1">
              ${item.room ? `<span>🏢 Корпус: ${item.room}</span>` : '<span></span>'}
              ${item.teacher ? `<span>👨‍🏫 ${item.teacher}</span>` : ''}
            </div>
          </div>
        `).join('');
      }

      const template = document.getElementById('share-card-template');

      try {
        const canvas = await html2canvas(template, {
          backgroundColor: '#020617',
          scale: 2
        });

        canvas.toBlob(async (blob) => {
          const file = new File([blob], `schedule-${targetDay.short}.png`, { type: 'image/png' });

          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            try {
              await navigator.share({
                files: [file],
                title: 'Расписание занятий',
                text: `Расписание на ${targetDay.full} (${targetDay.formattedDate})`
              });
            } catch (err) {
              if (err.name !== 'AbortError') downloadImage(canvas, targetDay.short);
            }
          } else {
            downloadImage(canvas, targetDay.short);
          }
        }, 'image/png');
      } catch (e) {
        alert('Ошибка при формировании картинки');
      }
    }

    function downloadImage(canvas, dayShort) {
      const link = document.createElement('a');
      link.download = `schedule-${dayShort}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    // Инициализация
    initGreeting();
    renderDaysNav();
    loadData();
    setInterval(updateStatusWidget, 30000);
  </script>
</body>
</html>
